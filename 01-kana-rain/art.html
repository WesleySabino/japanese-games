</head><body><main><div class="art-header"><a href="./">← Return to the garden</a><p class="eyebrow" style="margin-top:30px">KANA RAIN · VISUAL DEVELOPMENT</p><h1>A garden, imagined.</h1><p>Concepts created before implementation, and the artwork that brings the game to life.</p></div><div class="art-grid"><figure class="wide"><img src="assets/concepts/visual-development.png" alt="Concept board showing a rainy Japanese garden and glowing droplets with rain spirits"><figcaption><h2>The first sketches</h2><p>A quiet garden, a luminous drop, a little companion. The starting point for the visual direction.</p></figcaption></figure><figure class="wide"><img src="assets/concepts/garden-mood.png" alt="Painted rain garden with a little turquoise spirit and glowing drops"><figcaption><h2>The feeling of rain</h2><p>A second concept explores the full scene, depth, lighting, and the rain spirit.</p></figcaption></figure><figure class="wide"><img src="assets/garden.webp" alt="Production background with clear dark mist above a pond and stone lantern"><figcaption><h2>Room for reading</h2><p>The production background keeps the central sky quiet so kana remain readable.</p></figcaption></figure><figure><img class="atlas" src="assets/spirit-atlas.png" alt="Transparent rain spirit sprite sheet with idle, happy, worried, and sleeping poses"><figcaption><h2>A companion for every moment</h2><p>Four transparent poses used for greeting, correct answers, mistakes, and pauses.</p></figcaption></figure><figure><img class="atlas" src="assets/water-atlas.png" alt="Transparent water sprites: teal drop, coral stained drop, splash, and ripple"><figcaption><h2>One drop at a time</h2><p>The gameplay drop, error state, success splash, and pond ripple. Kana are overlaid as real text.</p></figcaption></figure></div></main></body></html>
