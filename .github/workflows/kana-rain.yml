name: Kana Rain CI

on:
  push:
    paths:
      - '01-kana-rain/**'
      - '.github/workflows/kana-rain.yml'
  pull_request:
    paths:
      - '01-kana-rain/**'
      - '.github/workflows/kana-rain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kana-rain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 01-kana-rain
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSER_CHANNEL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          package_json_file: 01-kana-rain/package.json
          run_install: false
          cache: true
          cache_dependency_path: 01-kana-rain/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm test

      - name: Use the official Ubuntu mirror with bounded download retries
        run: |
          for sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$sources" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$sources"
            fi
          done
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-kana-rain-ci-downloads

      - name: Install Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm run test:browser

      - name: Run learning improvement browser checks
        run: pnpm run test:improvements

      - name: Run gradual kana presentation browser checks
        run: pnpm run test:novelty-presentation

      - name: Run new kana pace browser checks
        run: pnpm run test:novelty-pace

      - name: Run sound pad browser checks
        run: pnpm run test:sound-pad

      - name: Run Katakana matching and keyboard browser checks
        run: pnpm run test:katakana-bridge

      - name: Run menu music browser checks
        run: pnpm run test:music

      - name: Build the static site
        run: pnpm build

      - name: Run Journey progression, mixed rain, two-tab and offline browser checks
        run: pnpm run test:journey

      - name: Run batched saves, large-history tab closing and reduced effects browser checks
        run: pnpm run test:smoother-saving

      - name: Run nonblocking feedback image preparation browser checks
        run: pnpm run test:effects

      - name: Run results, sound-pad focus and audio settings browser checks
        run: pnpm run test:quick-wins

      - name: Run version update, retained progress and offline recovery browser checks
        run: pnpm run test:update

      - name: Run native storage quota, browser restart and multi-tab regressions
        run: pnpm run test:storage

      - name: Run mixed-version save protection and checkpoint recovery
        run: pnpm run test:mixed-version-storage

      - name: Run progress import, retained history and reload checks
        run: pnpm run test:import
